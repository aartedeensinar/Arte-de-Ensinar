<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em Manutenção | Estamos Preparando Novidades</title>
    <!-- Fonte Inter via Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a; /* Azul escuro corporativo */
            color: #f8fafc;
            overflow: hidden;
            position: relative;
        }

        /* Efeito de luz animado ao fundo */
        .glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(59,130,246,0.25) 0%, rgba(15,23,42,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulseGlow 6s ease-in-out infinite alternate;
            z-index: 1;
            pointer-events: none;
        }

        /* Container Principal com efeito Glassmorphism */
        .container {
            position: relative;
            z-index: 2;
            max-width: 600px;
            width: 90%;
            padding: 3rem 2rem;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-out;
        }

        /* Animação do Ícone de Ajustes/Engrenagem */
        .icon-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 50%;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .gear {
            width: 40px;
            height: 40px;
            stroke: #3b82f6;
            animation: spin 8s linear infinite;
        }

        /* Tipografia */
        .status-badge {
            display: inline-block;
            padding: 0.35rem 1rem;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 1.2rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* Barra de Progresso Animada */
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
            margin-bottom: 2rem;
        }

        .progress-bar {
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            border-radius: 3px;
            position: absolute;
            animation: shimmer 2s infinite ease-in-out;
        }

        /* Botões de Redes Sociais */
        .buttons-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.8rem 1.4rem;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-instagram {
            background: rgba(225, 48, 108, 0.15);
            color: #f472b6;
            border: 1px solid rgba(225, 48, 108, 0.3);
        }

        .btn-instagram:hover {
            background: #e1306c;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(225, 48, 108, 0.4);
        }

        .btn-whatsapp {
            background: rgba(37, 211, 102, 0.15);
            color: #4ade80;
            border: 1px solid rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp:hover {
            background: #25d366;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(37, 211, 102, 0.4);
        }

        .btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Animações Keyframes */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shimmer {
            0% { left: -40%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }

        /* Responsividade */
        @media (max-width: 480px) {
            .container { padding: 2rem 1.5rem; }
            h1 { font-size: 1.75rem; }
            p { font-size: 0.9rem; }
            .buttons-container { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <main class="container">
        <div class="icon-container">

                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        </div>

        <span class="status-badge">Plataforma em Atualização</span>
        <h1>Estamos preparando algo incrível para você!</h1>
        <p>Nosso site está passando por melhorias técnicas e em breve estará no ar com uma nova experiência completa.</p>

        </div>

                </svg>
                WhatsApp
            </a>
        </div>
    </main>

    <script>
        // Efeito interativo: luz suave acompanhando o mouse
        document.addEventListener('mousemove', (e) => {
            const glow = document.querySelector('.glow');
            const x = e.clientX;
            const y = e.clientY;
            glow.style.left = `${x}px`;
            glow.style.top = `${y}px`;
        });
    </script>
</body>
</html>
